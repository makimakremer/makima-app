<!DOCTYPE html>
<html>
<body>
<canvas id="canvas192" width="192" height="192"></canvas>
<canvas id="canvas512" width="512" height="512"></canvas>
<script>
function createIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  
  // Background
  ctx.fillStyle = '#ff914d';
  ctx.fillRect(0, 0, size, size);
  
  // Chain emoji
  ctx.font = `${size * 0.6}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔗', size/2, size/2);
}

createIcon('canvas192', 192);
createIcon('canvas512', 512);

// Note: This is a template. Actual PNG generation requires server-side or manual export.
console.log('Icons would be generated here. For MVP, use any 192x192 and 512x512 PNG files.');
</script>
</body>
</html>
